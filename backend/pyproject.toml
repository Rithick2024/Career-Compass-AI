[project]
name = "career-compass-backend"
version = "0.1.0"
description = "Career Compass AI - Smart Placement Analytics Platform (Backend)"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
